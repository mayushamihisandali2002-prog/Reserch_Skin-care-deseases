[phases.setup]
nixPkgs = ["python311", "ffmpeg", "git-lfs"]

[phases.install]
cmds = [
    "python3 -m pip install --upgrade pip",
    "python3 -m pip install torch==2.2.2+cpu torchvision==0.17.2+cpu --extra-index-url https://download.pytorch.org/whl/cpu",
    "python3 -m pip install -r backend/requirements.txt"
]

[start]
cmd = "cd backend && python3 -m gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
